site_name: Evelina_IS
theme:
    name: material
    highlightjs: true
    hljs_languages:
        - c
        - assembly
        - python
    primary: purple
    icon:
        logo: material/dog
    language: en
    features:
        - navigation.tabs
        - search.highlight
        - search.suggestions

copyright: "Copyright © 2026 Evelina_IS"

nav:
    - 首页: index.md
    - fds_project:
        - project1: fds_project/project1.md

# 简化的 Markdown 扩展
markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.tabbed:
        alternate_style: true
    - attr_list
    - def_list
    - footnotes
    - tables
    - toc:
        permalink: true

# 简化的插件配置（只保留搜索）
plugins:
    - search

extra_css:
    - stylesheets/extra.css