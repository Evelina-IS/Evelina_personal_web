copyright: "Copyright © 2026 Evelina_IS"

nav:
  - 首页: index.md
  - website_oneinall: oneinall.md
  - FDSNOTE: fds.md
  - git的使用: git的使用.md
  
  - Probability Theory:
      - 概率论笔记（全英）: probability/index.md
  - 离散数学:
      - 前置知识: discrete-math/index.md
      - 逻辑等价、蕴涵与范式: discrete-math/logical-equivalence.md
      - 谓词逻辑: discrete-math/predicate-logic.md
      - 集合论: discrete-math/set-theory.md
      - 图论: discrete-math/graph-theory.md
      - 抽象代数: discrete-math/abstract-algebra.md
      - 语言分析与图灵机: discrete-math/language-automata.md
  - SYS1:
      - SYS汇编: SYS1/sys汇编.md
      - 指令集: SYS1/指令集.md
      - risc-v使用指南: SYS1/risc-v使用指南.md
theme:
  name: material
  icon:
    edit: material/pencil
  features:
    - content.action.edit
    - content.code.copy
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.footer
  font:
    code: JetBrains Mono
    text: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - meta
  - def_list
  - attr_list
  - md_in_html
  - sane_lists
  - admonition
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/reader-counter.js
  - javascripts/comments.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css
  - stylesheets/extra.css

extra:
  comments:
    provider: giscus
    giscus:
      repo: Evelina-IS/Evelina_personal_web
