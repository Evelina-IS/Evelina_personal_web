# CSS 依赖顺序：全局变量 → 界面结构调整 → 新增功能 → 首页专属覆盖。
extra_css:
  - theme/css/variables.css
  - theme/css/main.css
  - theme/css/features.css
  - theme/css/home.css

# JS 依赖顺序：core.js 先建立 window.site；highlight.js 与 features/ 下的独立模块
# 都通过该共享生命周期、主题总线或 DOM 工具运行。
extra_javascript:
  - theme/js/core.js
  - theme/js/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/x86asm.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cmake.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/http.min.js
  - theme/js/highlight.js
  - theme/js/features/content.js
  - theme/js/features/pdf.js
  - theme/js/features/enhancements.js

theme:
  name: material
  language: zh
  custom_dir: overrides
  logo: ""
  favicon: theme/assets/favicon.svg
  icon:
    edit: material/pencil
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/theme-light-dark
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 浅色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 深色模式

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: false
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde:
      smart_delete: false
  - toc:
      permalink: ""
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang:
        - en
        - ja
  - tags

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Evelina-IS
      name: Evelina-IS on GitHub
