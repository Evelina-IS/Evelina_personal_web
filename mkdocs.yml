      - 气体动理论: 大物/气体动理论.md
      - 热力学基础: 大物/热力学基础.md
      - 热学公式大全: 大物/热学公式大全.md

theme:
  name: material
  language: zh
  icon:
    edit: material/pencil
    logo: material/book-education-outline
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  font:
    code: JetBrains Mono
    text: Noto Sans SC
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - meta
  - def_list
  - attr_list
  - md_in_html
  - sane_lists
  - admonition
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang:
        - en
        - ja
  - tags

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/reader-counter.js
  - javascripts/comments.js
  - javascripts/extra.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css
  - stylesheets/extra.css

extra:
  comments:
    provider: giscus
    giscus:
      repo: Evelina-IS/Evelina_personal_web
      repo_id: R_kgDORx941w
      category: General
      category_id: DIC_kwDORx94184C-y0r
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Evelina-IS
      name: Evelina-IS on GitHub
  generator: false
