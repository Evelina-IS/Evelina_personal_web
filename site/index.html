<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Evelina 的极简学习笔记站">
  <title>Evelina_IS</title>
  <link rel="stylesheet" href="./assets/terminal.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="prompt">EVELINA_IS</div>
        <h1>home directory</h1>
        <p>green-on-black notes.</p>
      </div>
      <nav id="tree" class="tree"></nav>
    </aside>
    <section class="viewer">
      <div class="viewer__bar">
        <span id="crumb">/home/notes</span>
        <span id="status">ready</span>
      </div>
      <article id="content" class="content"></article>
    </section>
  </main>
  <footer class="site-footer">Copyright © 2026 Evelina_IS</footer>

  <script>
    const SOURCES = [
      { group: "主页", title: "Reports", path: "reports/index.html" },
      { group: "主页", title: "大物乙1", path: "大物乙1/大学物理公式大全_副本.md" },
      { group: "主页", title: "git 的使用", path: "git的使用.md" },
      { group: "概率论", title: "概率论笔记（全英）", path: "probability/index.html" },
      { group: "离散数学", title: "前置知识", path: "discrete-math/index.html" },
      { group: "离散数学", title: "逻辑等价、蕴涵与范式", path: "discrete-math/logical-equivalence.md" },
      { group: "离散数学", title: "谓词逻辑", path: "discrete-math/predicate-logic.md" },
      { group: "离散数学", title: "集合论", path: "discrete-math/set-theory.md" },
      { group: "离散数学", title: "图论", path: "discrete-math/graph-theory.md" },
      { group: "离散数学", title: "抽象代数", path: "discrete-math/abstract-algebra.md" },
      { group: "离散数学", title: "语言分析与图灵机", path: "discrete-math/language-automata.md" },
      { group: "SYS 体系结构", title: "sys 汇编", path: "SYS1/sys汇编.md" },
      { group: "SYS 体系结构", title: "指令集", path: "SYS1/指令集.md" },
      { group: "SYS 体系结构", title: "risc-v 使用指南", path: "SYS1/risc-v使用指南.md" },
      { group: "SYS 体系结构", title: "处理器设计 (Datapath)", path: "SYS1/processor-design.md" },
      { group: "SYS 体系结构", title: "多周期 CPU", path: "SYS1/多周期CPU.md" },
      { group: "SYS 体系结构", title: "控制信号速查表", path: "SYS1/control-signals.md" },
      { group: "SYS 体系结构", title: "单周期 CPU 实验报告", path: "SYS1/单周期CPU实验报告.md" },
      { group: "大学物理", title: "力学与振动", path: "大物/力学与振动.md" },
      { group: "大学物理", title: "气体动理论", path: "大物/气体动理论.md" },
      { group: "大学物理", title: "热力学基础", path: "大物/热力学基础.md" },
      { group: "大学物理", title: "热学公式大全", path: "大物/热学公式大全.md" }
    ];

    const PDFS = [
      { group: "PDF", title: "FDS Project 1 Essay", path: "reports/FDS/SongLi2026_3250104303_project1_essay.pdf" },
      { group: "PDF", title: "FDS Project 2", path: "reports/FDS/project2.pdf" },
      { group: "PDF", title: "FDS Report 3", path: "reports/FDS/report3.pdf" },
      { group: "PDF", title: "SYS1 LAB5", path: "reports/SYS1/3250104303_LAB5.pdf" },
      { group: "PDF", title: "SYS1 Lab2", path: "reports/SYS1/3250104303_lab2.pdf" },
      { group: "PDF", title: "SYS1 Lab3", path: "reports/SYS1/3250104303_lab3.pdf" },
      { group: "PDF", title: "SYS1 Lab4", path: "reports/SYS1/3250104303_lab4 (2).pdf" },
      { group: "PDF", title: "SYS1 Sys Project", path: "reports/SYS1/3250104303_sysproject.pdf" },
      { group: "PDF", title: "SYS1 Lab1", path: "reports/SYS1/Lab1-report.pdf" },
      { group: "PDF", title: "SYS1 Lab0", path: "reports/SYS1/lab0-report.pdf" }
    ];

    const tree = document.getElementById('tree');
    const content = document.getElementById('content');
    const crumb = document.getElementById('crumb');
    const status = document.getElementById('status');

    const groups = SOURCES.concat(PDFS).reduce((acc, item) => {
      (acc[item.group] ||= []).push(item);
      return acc;
    }, {});

    tree.innerHTML = Object.entries(groups).map(([group, items]) => `
      <details>
        <summary>${group}</summary>
        ${items.map(item => `<button class="file" data-path="${item.path}" data-title="${item.title}">${item.title}</button>`).join('')}
      </details>
    `).join('');

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function markdownToHtml(src) {
      const lines = src.replace(/\r\n/g, '\n').split('\n');
      let out = [];
      let inList = false;
      let inCode = false;
      let inPara = false;

      const flushPara = () => { if (inPara) { out.push('</p>'); inPara = false; } };
      const flushList = () => { if (inList) { out.push('</ul>'); inList = false; } };

      for (const raw of lines) {
        const line = raw.trimEnd();
        if (line.startsWith('```')) {
          flushPara(); flushList();
          out.push(inCode ? '</code></pre>' : '<pre><code>');
          inCode = !inCode;
          continue;
        }
        if (inCode) { out.push(escapeHtml(line)); continue; }
        if (!line.trim()) { flushPara(); flushList(); continue; }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          flushPara(); flushList();
          out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
          continue;
        }
        if (/^[-*]\s+/.test(line)) {
          if (!inList) { flushPara(); out.push('<ul>'); inList = true; }
          out.push(`<li>${inline(line.replace(/^[-*]\s+/, ''))}</li>`);
          continue;
        }
        if (!inPara) { flushList(); out.push('<p>'); inPara = true; }
        out.push(inline(line) + ' ');
      }
      flushPara(); flushList();
      if (inCode) out.push('</code></pre>');
      return out.join('\n');
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    function detectKind(path) {
      return path.toLowerCase().endsWith('.pdf') ? 'pdf' : 'md';
    }

    async function loadDoc(path, title) {
      status.textContent = 'loading';
      crumb.textContent = path;
      if (detectKind(path) === 'pdf') {
        content.innerHTML = `
          <div class="doc doc--pdf">
            <h1>${title}</h1>
            <p class="pdf-note">PDF 预览在浏览器新标签打开。</p>
            <a class="pdf-open" href="${path}" target="_blank" rel="noopener">Open PDF</a>
          </div>
        `;
        const link = content.querySelector('.pdf-open');
        if (link) link.click();
        status.textContent = 'ready';
        return;
      }
      const res = await fetch(path, { cache: 'force-cache' });
      const text = await res.text();
      content.innerHTML = `<h1>${title}</h1><div class="doc">${markdownToHtml(text)}</div>`;
      status.textContent = 'ready';
    }

    tree.addEventListener('click', (e) => {
      const btn = e.target.closest('.file');
      if (!btn) return;
      document.querySelectorAll('.file').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      loadDoc(btn.dataset.path, btn.dataset.title);
    });

    document.querySelector('.file')?.click();
  </script>
</body>
</html>
